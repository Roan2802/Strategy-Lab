<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
<title id="title">Dukascopy Strategy Lab</title>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#172a40"/><stop offset="1" stop-color="#091321"/>
  </linearGradient>
  <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
    <stop stop-color="#4bd2c6"/><stop offset="1" stop-color="#a1f0d8"/>
  </linearGradient>
  <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0">
    <stop stop-color="#e6ad3e"/><stop offset="1" stop-color="#ffdc7a"/>
  </linearGradient>
</defs>
<!-- Rounded, high-contrast tile with a quiet edge that survives taskbar scaling. -->
<rect x="36" y="36" width="952" height="952" rx="224" fill="url(#tile)"/>
<rect x="48" y="48" width="928" height="928" rx="212" fill="none" stroke="#70ded1" stroke-opacity=".45" stroke-width="8"/>
